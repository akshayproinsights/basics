<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Engineer Roadmap Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<!-- Firebase SDKs -->
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ── PASTE YOUR FIREBASE CONFIG HERE ──────────────────────────────────────────
// Go to https://console.firebase.google.com → Your project → Project settings
// → "Your apps" → Web app → firebaseConfig
const firebaseConfig = {
  apiKey: "AIzaSyDyz0PtExSH2ZdUmNu3pl-Ta3G5GhbT54Q",
  authDomain: "ai-engineer-tracker-44207.firebaseapp.com",
  projectId: "ai-engineer-tracker-44207",
  storageBucket: "ai-engineer-tracker-44207.firebasestorage.app",
  messagingSenderId: "442639367019",
  appId: "1:442639367019:web:18c1c60503f404ca21ea2e",
  measurementId: "G-XXM0X9HEYL"
};
// ─────────────────────────────────────────────────────────────────────────────

const fbApp=initializeApp(firebaseConfig);
const fbAuth=getAuth(fbApp);
const fbDb=getFirestore(fbApp);
const provider=new GoogleAuthProvider();

window._fb={fbAuth,fbDb,provider,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,doc,getDoc,setDoc};
window._fbReady=true;
window.dispatchEvent(new Event("fb-ready"));
</script>
<style>
:root{
  --bg:#EEF2EF;--surface:#FFFFFF;--ink:#1C2B27;--muted:#5E6E68;--line:#D6DDD8;
  --accent:#1F6F5C;--accent-soft:#DCEBE5;--gold:#D9981A;--gold-soft:#FBEFD2;--danger:#B4442F;
  --hover:rgba(31,111,92,.07);
  --serif:"Iowan Old Style","Charter","Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111916;--surface:#18221F;--ink:#E4EBE7;--muted:#93A39C;--line:#2A3833;
  --accent:#4DB396;--accent-soft:#1E3530;--gold:#F2B94A;--gold-soft:#3A3020;--danger:#E07A63;
  --hover:rgba(77,179,150,.09);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button{font:inherit;cursor:pointer;color:inherit}

/* header */
header.top{padding:calc(26px + env(safe-area-inset-top,0px)) 0 4px}
.titlebar{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.titlebox{flex:1;min-width:280px}
h1.title{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.15;margin:0;letter-spacing:-.01em}
.goal{color:var(--muted);max-width:74ch;margin-top:6px}
.hdr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.saved{font-size:13px;color:var(--muted);min-width:90px;text-align:right}
.saved.err{color:var(--danger);font-weight:600}

/* buttons & inputs */
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;font-size:14px;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0e1a16}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--danger)}
.btn.small{padding:3px 8px;font-size:13px}
.btn.nudge{border-color:var(--gold);background:var(--gold-soft)}
input[type=text],input[type=url],input[type=date],input[type=number],input[type=search],select,textarea{
  font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
input[type=number]{width:84px}
textarea{width:100%;min-height:72px;resize:vertical;line-height:1.5}
label.inline{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}

/* editable text */
.ed{outline:none;border-radius:4px;padding:1px 4px;margin:-1px -4px;white-space:pre-wrap;word-break:break-word;min-height:1.4em}
.ed:hover{background:var(--hover)}
.ed:focus{background:var(--hover);box-shadow:0 0 0 1px var(--accent)}
.ed:empty::before{content:attr(data-ph);color:var(--muted);opacity:.75}

/* route */
.route{margin:20px 0 4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px}
.route-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.route-head .big{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.2}
.route-head .sub{max-width:60ch}
.route-overall{min-width:220px;flex:0 1 320px}
.route-overall .bar{height:8px}
.route-scroll{overflow-x:auto;padding-bottom:4px}
.route-track{position:relative;display:flex;justify-content:space-between;min-width:760px;padding:2px 2px 0}
.route-line{position:absolute;left:17px;right:17px;top:17px;height:3px;background:var(--line);border-radius:2px}
.route-line i{display:block;height:100%;background:var(--gold);border-radius:2px}
.stn{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;color:var(--muted);font-size:12px;width:34px}
.stn .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0)}
.stn .dot span{width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:11.5px;color:var(--ink);font-weight:600}
.stn.full .dot span{background:var(--accent);color:#fff}
:root[data-theme="dark"] .stn.full .dot span{color:#0e1a16}
.stn.ms .dot{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--gold)}
.stn.now{color:var(--ink);font-weight:700}
.stn .now-tag{font-size:11px;background:var(--gold);color:#1c1406;border-radius:999px;padding:0 6px;font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%}

/* tabs */
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:20px 0 22px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:15px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* layout */
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:880px){.grid2{grid-template-columns:1fr}}
.col{display:grid;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel h2{font-family:var(--serif);font-size:21px;font-weight:600;margin:0 0 4px;line-height:1.25}
.panel h3{font-size:15px;margin:14px 0 6px}
.sub{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}

/* bars */
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.bar.gold i{background:var(--gold)}

/* why card */
.why{border-left:3px solid var(--gold);background:var(--surface);border-radius:0 10px 10px 0;padding:16px 18px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.why p{font-family:var(--serif);font-size:18px;line-height:1.45;margin:0 0 10px}

/* phases & weeks */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.toolbar input[type=search]{flex:1;min-width:200px}
.phase{margin-bottom:36px}
.phase-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.phase-name{font-family:var(--serif);font-size:27px;font-weight:600;margin:0;line-height:1.2}
.phase-why{color:var(--muted);max-width:74ch;margin-top:4px}
.phase-meta{min-width:210px;flex:0 0 240px}
.phase-meta .sub{margin-bottom:6px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.week.current{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.week.complete .badge{background:var(--accent);color:#fff}
:root[data-theme="dark"] .week.complete .badge{color:#0e1a16}
.week-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.badge{flex:none;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.badge.ms{background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold)}
.week-title{flex:1;min-width:180px;font-weight:600}
.week-dates{font-size:13px;color:var(--muted);white-space:nowrap}
.mini{width:90px;flex:none}
.count{font-size:13px;color:var(--muted);min-width:44px;text-align:right}
.chev{display:inline-block;transition:transform .15s;color:var(--muted)}
.week.open .chev{transform:rotate(90deg)}
.week-body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 22px;margin:12px 0 6px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.sec-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}

/* tasks */
.tasks{list-style:none;margin:8px 0 0;padding:0}
.task{border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.trow{display:flex;align-items:flex-start;gap:10px;padding:8px 0}
.chk{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;flex:none;margin:2px 0 0;cursor:pointer;display:grid;place-items:center;background:var(--surface)}
.chk:hover{border-color:var(--accent)}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
:root[data-theme="dark"] .chk:checked::after{border-color:#0e1a16}
.ttext{flex:1;min-width:0}
.task.done > .trow .ttext{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.tmeta{display:flex;gap:10px;align-items:center;flex:none;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.when{font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap}
.icons{font-size:12px;color:var(--muted);white-space:nowrap}
.tdetail{padding:2px 0 16px 30px;display:grid;gap:14px}
.tdetail h4{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.list-mini{list-style:none;padding:0;margin:2px 0}
.list-mini li{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:14px;flex-wrap:wrap}
.list-mini a{word-break:break-all}
.addrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.addrow input[type=text],.addrow input[type=url]{flex:1;min-width:170px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding:4px 0}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--line))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--line))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--line))}
.heat i.l4{background:var(--accent)}
.heat i.today{outline:2px solid var(--gold);outline-offset:1px}
.heat i.out{opacity:.35}

/* milestones */
.ms-list{list-style:none;padding:0;margin:8px 0 0}
.ms-list li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.ms-list li:first-child{border-top:0}

/* tables */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td .ed{min-width:90px}
.stage-chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.stage-chips span{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.stage-chips b{color:var(--ink)}

/* reference */
.cards{columns:2 380px;column-gap:20px}
.card{break-inside:avoid;margin-bottom:20px;display:block}
.card ul{padding-left:18px;margin:8px 0 0}
.card li{margin:5px 0}
.card li .li-row{display:flex;gap:6px;align-items:flex-start}
.card li .li-row .ed{flex:1}
.x{opacity:0;border:0;background:none;color:var(--muted);padding:0 4px;font-size:15px;line-height:1.4}
li:hover > .li-row > .x,li:focus-within > .li-row > .x,.x:focus{opacity:1}
@media (hover:none){.x{opacity:.6}}

/* firebase auth bar */
.auth-btn{display:flex;align-items:center;gap:7px;padding:5px 13px 5px 8px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap;}
.auth-btn:hover{background:var(--hover);border-color:var(--accent);}
.auth-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;}
.auth-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;}
.sync-badge{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-left:4px;}
/* toast + fx */
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;gap:14px;align-items:center;z-index:50;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:calc(100vw - 32px)}
#toast.show{display:flex}
#toast button{background:none;border:0;color:var(--gold);font-weight:700;padding:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
footer{color:var(--muted);font-size:13px;padding:30px 0 40px}
@media (prefers-reduced-motion:reduce){.chev,.bar i{transition:none}}
@media (max-width:600px){
  h1.title{font-size:27px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mini{display:none}
  .tdetail{padding-left:0}
  .trow{flex-wrap:wrap}
  .ttext{flex:1 1 calc(100% - 34px)}
  .tmeta{margin-left:30px;justify-content:flex-start;width:100%}
  .phase-meta{flex:1 1 100%}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="hdr"></header>
  <section class="route" id="route" aria-label="Weekly route"></section>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
"use strict";
/* ============ firebase cloud sync ============ */
let fbUser=null,fbSyncing=false;
function fbDocRef(){if(!fbUser||!window._fb)return null;const{fbDb,doc}=window._fb;return doc(fbDb,"trackers",fbUser.uid);}
async function fbLoad(){if(!fbUser||!window._fb)return null;try{const{getDoc}=window._fb;const r=await getDoc(fbDocRef());return r.exists()?r.data().state:null;}catch(e){console.error("Firestore load:",e);return null;}}
async function fbSave(s){if(!fbUser||!window._fb||fbSyncing)return;fbSyncing=true;try{const{setDoc}=window._fb;await setDoc(fbDocRef(),{state:s,uid:fbUser.uid,updated:new Date().toISOString()});}catch(e){console.error("Firestore save:",e);}finally{fbSyncing=false;}}
function fbSignIn(){if(!window._fb)return;const{fbAuth,provider,signInWithPopup}=window._fb;signInWithPopup(fbAuth,provider).catch(e=>toast("Sign-in failed: "+e.message));}
function fbSignOut(){if(!window._fb)return;const{fbAuth,signOut}=window._fb;signOut(fbAuth).then(()=>{fbUser=null;render();toast("Signed out. Progress saved locally.");});}
function fbInit(){
  if(!window._fb)return;
  const{fbAuth,onAuthStateChanged}=window._fb;
  onAuthStateChanged(fbAuth,async u=>{
    fbUser=u;
    if(u&&typeof render==="function"){
      const cloud=await fbLoad();
      if(cloud&&(!state||!state.updated||(cloud.updated||"")>(state.updated||""))){
        state=cloud;migrate();render();toast("☁️ Synced from cloud ("+u.displayName+")");}
      else if(state&&state.updated){await fbSave(JSON.parse(JSON.stringify(state)));}
      render();
    }else if(typeof render==="function")render();
  });
}
window.addEventListener("fb-ready",fbInit);
if(window._fbReady)fbInit();

/* ============ constants & helpers ============ */
const CATS={learn:["Learn","#3B6FB6"],build:["Build","#1F8A6E"],tracelink:["TraceLink","#7A4FB0"],dsa:["DSA","#C0772B"],design:["System design","#2E8A99"],mock:["Mock interview","#B5476B"],notes:["Notebook","#6E7B55"],jobs:["Job search","#8A6A1F"],revise:["Revise","#7C8A84"],selftest:["Self-test","#A3542E"]};
const STAGES=["Wishlist","Applied","Screening","Interviewing","Offer","Rejected","Withdrawn"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const LSK="ai-roadmap-tracker-state";
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO=()=>iso(new Date());
const pd=s=>new Date(s+"T00:00:00");
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d);};
const fmt=s=>{if(!s)return"";const d=pd(s);return d.getDate()+" "+MON[d.getMonth()];};
const fmtY=s=>s?fmt(s)+" "+pd(s).getFullYear():"";
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const $=s=>document.querySelector(s);
const PROPS=new Set(["checked","value","disabled","selected"]);
function h(tag,a,...kids){
  const e=document.createElement(tag);
  if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
    if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;
    else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2),v);
    else if(PROPS.has(k))e[k]=v;else e.setAttribute(k,v===true?"":v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
}
function ed(obj,key,o={}){
  const e=h(o.tag||"div",{class:"ed "+(o.cls||""),"data-ph":o.ph||"Click to edit",spellcheck:"true",role:"textbox","aria-label":o.label||o.ph||"Editable text"});
  e.textContent=obj[key]||"";
  try{e.contentEditable="plaintext-only";}catch(_){}
  if(e.contentEditable!=="plaintext-only")e.contentEditable="true";
  e.addEventListener("input",()=>{obj[key]=e.innerText.replace(/\n+$/,"");save();if(o.onchange)o.onchange();});

function cw(){return Math.floor(daysBetween(state.settings.start,todayISO())/7)+1;}
function weekStart(num){return addDays(state.settings.start,(num-1)*7);}
function weekRange(num){const s=weekStart(num);return fmt(s)+" to "+fmt(addDays(s,6));}
const findWeek=n=>allSections().find(s=>s.num===n);
function doneByDay(){const m={};for(const t of allTasks())if(t.done&&t.date)m[t.date]=(m[t.date]||0)+1;return m;}
function activeDay(d,dbd){const l=state.daily[d];return (dbd[d]||0)>0||(l&&((+l.min||0)>0||(+l.dsa||0)>0));}
function streak(){const dbd=doneByDay();let d=todayISO(),n=0;if(!activeDay(d,dbd))d=addDays(d,-1);
  for(let i=0;i<500&&activeDay(d,dbd);i++){n++;d=addDays(d,-1);}return n;}
function totals(){let min=0,dsa=0;for(const k in state.daily){min+=+state.daily[k].min||0;dsa+=+state.daily[k].dsa||0;}return{min,dsa};}
function weekStats(num){const s=weekStart(num),e=addDays(s,6);let min=0,dsa=0,tasks=0;
  for(const k in state.daily)if(k>=s&&k<=e){min+=+state.daily[k].min||0;dsa+=+state.daily[k].dsa||0;}
  for(const t of allTasks())if(t.done&&t.date>=s&&t.date<=e)tasks++;
  const apps=state.jobs.filter(j=>j.applied&&j.applied>=s&&j.applied<=e).length;return{min,dsa,tasks,apps};}

  L.append(h("section",{class:"panel"},h("h2",null,"Plan dates"),h("p",{class:"sub"},"Week dates and the Now marker are calculated from the Week 1 start. Moving it shifts every week."),
    h("div",{class:"row",style:"margin-top:10px"},h("label",{class:"inline"},"Week 1 starts",sd),h("label",{class:"inline"},"Target date",tg)),
    h("h3",null,"Appearance"),h("label",{class:"inline"},"Theme",th)));
  const imp=h("input",{type:"file",accept:"application/json,.json","aria-label":"Import backup"});imp.addEventListener("change",()=>{if(imp.files[0])importBackup(imp.files[0]);});
  L.append(h("section",{class:"panel"},h("h2",null,"Backup"),
    h("p",null,"Everything saves automatically in this browser, on this computer, a moment after each change. Open this same file in the same browser and you continue exactly where you left off."),
    h("p",{class:"sub"},"Clearing browsing data, private windows, or a different browser start empty. A weekly backup file protects you, including attached files."),
    h("div",{class:"row",style:"margin-top:8px"},h("button",{class:"btn primary",onclick:exportBackup},"Download backup"),h("span",{class:"btn filebtn"},"Restore from backup",imp)),
    h("p",{class:"sub"},s.lastBackup?"Last backup: "+fmtY(s.lastBackup):"No backup downloaded yet.")));
  const stor=h("section",{class:"panel"},h("h2",null,"Storage status"));
  stor.append(h("p",{class:"sub"},mode==="idb"?"Saving to IndexedDB with a copy in localStorage. File attachments are supported.":"IndexedDB is blocked here, so saving uses localStorage only and file attachments are off. Chrome or Edge support both for local files."));
  stor.append(h("p",{class:"sub"},persisted?"The browser granted persistent storage, so it will not clear this data on its own.":"Persistent storage was not granted. Data is still saved, but download backups regularly."));
  const est=h("p",{class:"sub"});stor.append(est);
  if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{est.textContent="Using "+fsize(e.usage||0)+" of about "+fsize(e.quota||0)+" available.";});
  Rt.append(stor);
  Rt.append(h("section",{class:"panel"},h("h2",null,"Reset"),h("p",{class:"sub"},"Download a backup first. Restoring the default roadmap replaces all phases, tasks and notes."),
    h("div",{class:"row"},h("button",{class:"btn danger",onclick:()=>{if(confirm("Replace everything with the default roadmap? Your ticks, notes and applications will be lost unless you have a backup.")){const th0=state.settings.theme;state=seed();state.settings.theme=th0;save();render();toast("Default roadmap restored");}}},"Restore default roadmap"))));
  Rt.append(h("section",{class:"panel"},h("h2",null,"How to use this"),h("ul",{style:"padding-left:18px;margin:6px 0"},
    ["Click any text to edit it. Press Enter to finish a single line.","Tick a task to mark it done; the date fills in with today and can be changed in Details.","Details holds notes, sources, files and the recall schedule.","Ticking a Learn task schedules recall on day 1, 3, 7 and 21 in the Today tab.","Log minutes and DSA problems daily to keep your streak.","Fill the weekly review every Sunday.","Download a backup every week."].map(x=>h("li",null,x)))));
  return g;
}
 
/* ============ backup ============ */
function blobToData(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
function dataToBlob(d,type){const b=atob(d.split(",")[1]||"");const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:type||""});}
async function exportBackup(){
  try{const files=[];if(mode==="idb"){const ids=new Set();allTasks().forEach(t=>t.files.forEach(f=>f.stored&&ids.add(f.id)));
      for(const id of ids){const r=await fileGet(id);if(r)files.push({id,name:r.name,type:r.type,size:r.size,data:await blobToData(r.blob)});}}
    state.settings.lastBackup=todayISO();
    const blob=new Blob([JSON.stringify({app:"ai-roadmap-tracker",version:1,exported:new Date().toISOString(),state,files})],{type:"application/json"});
    const a=h("a",{href:URL.createObjectURL(blob),download:"ai-roadmap-backup-"+todayISO()+".json"});document.body.append(a);a.click();a.remove();
    save();render();toast("Backup downloaded");}
  catch(e){alert("Backup failed: "+e.message);console.error(e);}
}
async function importBackup(file){
  try{const p=JSON.parse(await file.text());if(!p.state||!Array.isArray(p.state.phases))throw new Error("This file is not a roadmap backup.");
    if(!confirm("Replace everything in the tracker with the backup from "+(p.exported?new Date(p.exported).toLocaleString():"an unknown date")+"?"))return;
    if(mode==="idb")for(const f of p.files||[])await filePut({id:f.id,name:f.name,type:f.type,size:f.size||0,blob:dataToBlob(f.data,f.type)});
    state=p.state;migrate();applyTheme();save();render();toast("Backup restored");}
  catch(e){alert("Restore failed: "+e.message);console.error(e);}
}
 
/* ============ celebration ============ */
function celebrate(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#1F6F5C","#D9981A","#3B6FB6","#B5476B","#4DB396","#F2B94A"];
  const ps=Array.from({length:150},()=>({x:innerWidth/2,y:innerHeight*.32,vx:(Math.random()-.5)*15,vy:-Math.random()*13-3,s:Math.random()*7+4,c:cols[Math.random()*cols.length|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);for(const p of ps){p.vy+=.38;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();}
    if(++f<120)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height);})();
}
 
/* ============ render root & boot ============ */
function render(){
  const y=window.scrollY;
  renderHeader();renderRoute();renderTabs();
  const m=$("#main");m.innerHTML="";m.append(({today:vToday,roadmap:vRoadmap,jobs:vJobs,reference:vRef,settings:vSettings})[tab]());
  $("#foot").textContent=(fbUser?"☁️ Synced to cloud ("+fbUser.email+") + local backup. ":"💾 Saved in this browser only — sign in to sync across devices. ")+"Last change "+(state.updated?new Date(state.updated).toLocaleString():"not yet")+".";
  if(scrollTarget){const el=document.getElementById(scrollTarget);scrollTarget=null;if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
  else window.scrollTo(0,y);
  if(!saveTimer&&state.updated)setSaved("Saved");
}
async function boot(){
  let ls=null;try{ls=JSON.parse(localStorage.getItem(LSK)||"null");}catch(_){}
  try{db=await openDB();let s=await kvGet();if(ls&&(!s||(ls.updated||"")>(s.updated||"")))s=ls;state=s||seed();}
  catch(e){console.error(e);mode="ls";state=ls||seed();}
  migrate();applyTheme();
  const c=cw();const cur=c>=1?findWeek(c):null;if(cur&&!state.updated)cur.open=true;
  render();
  if(!state.updated)persist();
  cleanOrphans();
  if(navigator.storage&&navigator.storage.persist){try{persisted=await navigator.storage.persisted()||await navigator.storage.persist();}catch(_){}}
  if(mode==="ls")toast("File attachments are off in this browser. Saving still works.");
}
boot().catch(e=>{document.body.prepend(h("p",{style:"color:#B4442F;padding:16px;font-weight:600"},"The tracker failed to start: "+e.message));console.error(e);});
